<body class="login-page">
<main class="login">
  <p class="login-mark">Progent, taken apart</p>
  <h1>Least privilege for AI agents, checked by a solver</h1>
  <form method="post" action="/login" class="login-form">
    <input type="text" autocomplete="username" value="progent" hidden aria-hidden="true">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <!--error-->
    <button type="submit">Enter</button>
  </form>
  <p class="login-note">
    An interactive companion to
    <a href="https://arxiv.org/abs/2504.11703"><cite>Progent: Securing AI Agents with Privilege Control</cite></a>.
    Source on <a href="https://github.com/hriday/progent-lab">GitHub</a>.
  </p>
</main>
</body>
