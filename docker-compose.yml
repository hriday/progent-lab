services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Not published: only Caddy can reach it.
    expose: ["8000"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
